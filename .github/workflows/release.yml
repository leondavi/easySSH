# Build easySSH installers for macOS, Windows and Linux from a single tag.
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# Produces a draft release holding the .dmg (Apple Silicon + Intel), the
# Windows .exe and .msi, and a .deb for Debian and Ubuntu. Review it, then
# publish.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg,app
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg,app
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          # 22.04, not the newest image: a .deb links against the glibc it was
          # built on, so the oldest supported Ubuntu is the one that produces a
          # package the newer releases can install too.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The window easySSH draws in is the system web view, which on Linux
      # means WebKitGTK — needed to link, not just to bundle.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            librsvg2-dev libssl-dev libayatana-appindicator3-dev patchelf

      # tauri-action runs whatever `tauriScript` names, so the CLI has to be
      # on PATH before it starts. There is no package.json here to install from.
      - name: Cache the Tauri CLI
        id: tauri-cli
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-tauri
            ~/.cargo/bin/cargo-tauri.exe
          key: tauri-cli-v2-${{ runner.os }}

      - name: Install the Tauri CLI
        if: steps.tauri-cli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "^2" --locked

      # An unset secret still reaches the bundler as an empty variable, and the
      # macOS signing path triggers on the variable being *present* — which is
      # how a repository with no certificate ended up failing at `security
      # import` instead of producing an unsigned build. So decide first, then
      # run the build with the Apple variables or without them.
      - name: Is there a signing certificate?
        id: signing
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            echo "sign=true" >> "$GITHUB_OUTPUT"
          else
            echo "sign=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.signing.outputs.sign == 'false'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tauriScript: cargo tauri
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          tagName: ${{ github.ref_name }}
          releaseName: easySSH ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false

      # The same build, signed and notarised. Set APPLE_CERTIFICATE,
      # APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY, APPLE_ID,
      # APPLE_PASSWORD and APPLE_TEAM_ID as repository secrets to take this
      # path; without it users must right-click → Open on first launch.
      - name: Build (signed)
        if: steps.signing.outputs.sign == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: .
          tauriScript: cargo tauri
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          tagName: ${{ github.ref_name }}
          releaseName: easySSH ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
